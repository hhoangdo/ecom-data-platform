[project]
name = "vina-bim-shop-coursework"
version = "0.1.0"
description = "Python-first coursework scaffold for the Vina Bim Shop data engineering and AI project."
requires-python = ">=3.12"
dependencies = [
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "confluent-kafka>=2.8",
  "duckdb>=1.1",
  "faker>=24.0",
  "pandas>=2.2",
  "pillow>=10.0",
  "pyarrow>=19.0",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vina_bim_shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
