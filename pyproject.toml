[project]
name = "vina-bim-shop-coursework"
version = "0.1.0"
description = "Python-first coursework scaffold for the Vina Bim Shop data engineering and AI project."
requires-python = ">=3.12"
dependencies = [
  "faker>=24.0",
  "pandas>=2.2",
  "pyarrow>=19.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vina_bim_shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
