    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow_password@lakehouse-postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
