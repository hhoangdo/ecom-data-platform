      - ./infra/governance/recipes:/opt/airflow/recipes:ro
      - ./artifacts/airflow/logs:/opt/airflow/logs
      - ./evidence:/workspace/evidence
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20

