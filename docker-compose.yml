name: vina-bim-shop

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    profiles: ["ingestion", "all"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.3
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-connect:
    build:
      context: ./infra/kafka/connect
      dockerfile: Dockerfile
    image: vina-bim-shop/kafka-connect:7.8.3-s3
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: "vina-bim-shop-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect_configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect_offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect_status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      BRONZE_BUCKET: "${VBS_BRONZE_BUCKET:-bronze}"
      MINIO_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      MINIO_REGION: "${VBS_MINIO_REGION:-us-east-1}"
      MINIO_ACCESS_KEY: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      MINIO_SECRET_KEY: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "vina-bim-shop-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "local-connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["lakehouse", "batch", "all"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      MINIO_REGION_NAME: "${VBS_MINIO_REGION:-us-east-1}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["lakehouse", "batch", "all"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    volumes:
      - ./infra/lakehouse/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]

  lakehouse-postgres:
    image: postgres:16.4
    profiles: ["lakehouse", "batch", "orchestration", "all"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${VBS_LAKEHOUSE_POSTGRES_DB:-platform}"
      POSTGRES_USER: "${VBS_LAKEHOUSE_POSTGRES_USER:-vina_platform}"
      POSTGRES_PASSWORD: "${VBS_LAKEHOUSE_POSTGRES_PASSWORD:-vina_platform_password}"
    volumes:
      - lakehouse_postgres_data:/var/lib/postgresql/data
      - ./infra/lakehouse/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 12

  hive-metastore-init:
    build:
      context: ./infra/lakehouse/hive
      dockerfile: Dockerfile
    image: vina-bim-shop/hive-metastore:3.1.3-postgres
    profiles: ["lakehouse", "batch", "all"]
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/opt/hive/init-schema.sh"]
    environment:
      DB_DRIVER: "postgres"
      HIVE_METASTORE_DB: "${VBS_HIVE_METASTORE_DB:-hive_metastore}"
      HIVE_METASTORE_USER: "${VBS_HIVE_METASTORE_USER:-hive_metastore}"
      HIVE_METASTORE_PASSWORD: "${VBS_HIVE_METASTORE_PASSWORD:-hive_metastore_password}"
      HIVE_AUX_JARS_PATH: "/opt/hadoop/share/hadoop/tools/lib"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://lakehouse-postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive_metastore
        -Djavax.jdo.option.ConnectionPassword=hive_metastore_password
        -Dhive.metastore.warehouse.dir=s3a://silver/warehouse
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=${VBS_MINIO_ROOT_USER:-vina_minio}
        -Dfs.s3a.secret.key=${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false

  hive-metastore:
    build:
      context: ./infra/lakehouse/hive
      dockerfile: Dockerfile
    image: vina-bim-shop/hive-metastore:3.1.3-postgres
    profiles: ["lakehouse", "batch", "all"]
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: "metastore"
      DB_DRIVER: "postgres"
      HIVE_METASTORE_DB: "${VBS_HIVE_METASTORE_DB:-hive_metastore}"
      HIVE_METASTORE_USER: "${VBS_HIVE_METASTORE_USER:-hive_metastore}"
      HIVE_METASTORE_PASSWORD: "${VBS_HIVE_METASTORE_PASSWORD:-hive_metastore_password}"
      HIVE_AUX_JARS_PATH: "/opt/hadoop/share/hadoop/tools/lib"
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://lakehouse-postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive_metastore
        -Djavax.jdo.option.ConnectionPassword=hive_metastore_password
        -Dhive.metastore.warehouse.dir=s3a://silver/warehouse
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=${VBS_MINIO_ROOT_USER:-vina_minio}
        -Dfs.s3a.secret.key=${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
    volumes:
      - ./infra/lakehouse/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 10s
      retries: 12

  trino:
    image: trinodb/trino:476
    profiles: ["lakehouse", "batch", "all"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    volumes:
      - ./infra/lakehouse/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/lakehouse/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/lakehouse/trino/catalog:/etc/trino/catalog:ro
      - ./infra/lakehouse/trino/sql:/etc/trino/sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 12

  trino-worker:
    image: trinodb/trino:476
    profiles: ["lakehouse", "batch", "all"]
    depends_on:
      hive-metastore:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    volumes:
      - ./infra/lakehouse/trino/etc/worker-config.properties:/etc/trino/config.properties:ro
      - ./infra/lakehouse/trino/etc/worker-node.properties:/etc/trino/node.properties:ro
      - ./infra/lakehouse/trino/catalog:/etc/trino/catalog:ro
      - ./infra/lakehouse/trino/sql:/etc/trino/sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 12

  spark-master:
    build:
      context: .
      dockerfile: ./infra/spark/Dockerfile
    image: vina-bim-shop/spark:4.0.0-iceberg-1.10.1
    profiles: ["batch", "all"]
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    command: ["master"]
    ports:
      - "8085:8080"
    environment:
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_MINIO_REGION: "${VBS_MINIO_REGION:-us-east-1}"
      VBS_HIVE_METASTORE_INTERNAL_URI: "${VBS_HIVE_METASTORE_INTERNAL_URI:-thrift://hive-metastore:9083}"
      VBS_SILVER_BUCKET: "${VBS_SILVER_BUCKET:-silver}"
      VBS_GOLD_BUCKET: "${VBS_GOLD_BUCKET:-gold}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
    volumes:
      - ./:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/json/"]
      interval: 15s
      timeout: 10s
      retries: 20

  spark-worker:
    image: vina-bim-shop/spark:4.0.0-iceberg-1.10.1
    profiles: ["batch", "all"]
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["worker"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_MINIO_REGION: "${VBS_MINIO_REGION:-us-east-1}"
      VBS_HIVE_METASTORE_INTERNAL_URI: "${VBS_HIVE_METASTORE_INTERNAL_URI:-thrift://hive-metastore:9083}"
      VBS_SILVER_BUCKET: "${VBS_SILVER_BUCKET:-silver}"
      VBS_GOLD_BUCKET: "${VBS_GOLD_BUCKET:-gold}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 15s
      timeout: 10s
      retries: 20

  spark-history-server:
    image: vina-bim-shop/spark:4.0.0-iceberg-1.10.1
    profiles: ["batch", "all"]
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["history"]
    ports:
      - "18080:18080"
    environment:
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_MINIO_REGION: "${VBS_MINIO_REGION:-us-east-1}"
      VBS_HIVE_METASTORE_INTERNAL_URI: "${VBS_HIVE_METASTORE_INTERNAL_URI:-thrift://hive-metastore:9083}"
      VBS_SILVER_BUCKET: "${VBS_SILVER_BUCKET:-silver}"
      VBS_GOLD_BUCKET: "${VBS_GOLD_BUCKET:-gold}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/applications"]
      interval: 15s
      timeout: 10s
      retries: 20

  flink-jobmanager:
    build:
      context: .
      dockerfile: ./infra/flink/Dockerfile
    image: vina-bim-shop/flink:1.19.2-py311
    profiles: ["streaming", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/opt/flink/bin/run-with-time-limit.sh"]
    command: ["/docker-entrypoint.sh", "jobmanager"]
    ports:
      - "8086:8081"
    environment:
      VBS_KAFKA_BOOTSTRAP_SERVERS: "${VBS_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
      VBS_EVIDENCE_BUCKET: "${VBS_EVIDENCE_BUCKET:-evidence}"
      VBS_FLINK_MAX_RUNTIME_MINUTES: "${VBS_FLINK_MAX_RUNTIME_MINUTES:-45}"
      VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS: "${VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS:-30}"
      VBS_FLINK_DISABLE_AUTO_STOP: "${VBS_FLINK_DISABLE_AUTO_STOP:-false}"
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        state.backend: hashmap
        state.checkpoints.dir: s3://checkpoints/flink
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${VBS_MINIO_ROOT_USER:-vina_minio}
        s3.secret-key: ${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}
        s3.connection.ssl.enabled: false
    volumes:
      - ./:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 20

  flink-taskmanager:
    image: vina-bim-shop/flink:1.19.2-py311
    profiles: ["streaming", "all"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    entrypoint: ["/opt/flink/bin/run-with-time-limit.sh"]
    command: ["/docker-entrypoint.sh", "taskmanager"]
    environment:
      VBS_KAFKA_BOOTSTRAP_SERVERS: "${VBS_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
      VBS_EVIDENCE_BUCKET: "${VBS_EVIDENCE_BUCKET:-evidence}"
      VBS_FLINK_MAX_RUNTIME_MINUTES: "${VBS_FLINK_MAX_RUNTIME_MINUTES:-45}"
      VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS: "${VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS:-30}"
      VBS_FLINK_DISABLE_AUTO_STOP: "${VBS_FLINK_DISABLE_AUTO_STOP:-false}"
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: s3://checkpoints/flink
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${VBS_MINIO_ROOT_USER:-vina_minio}
        s3.secret-key: ${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}
        s3.connection.ssl.enabled: false
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://flink-jobmanager:8081/taskmanagers"]
      interval: 15s
      timeout: 10s
      retries: 20

  flink-job-submit:
    image: vina-bim-shop/flink:1.19.2-py311
    profiles: ["streaming", "all"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    entrypoint: ["/opt/flink/bin/run-with-time-limit.sh"]
    command: ["/opt/flink/bin/submit-jobs.sh"]
    environment:
      VBS_FLINK_JOBMANAGER_INTERNAL_URL: "${VBS_FLINK_JOBMANAGER_INTERNAL_URL:-http://flink-jobmanager:8081}"
      VBS_KAFKA_BOOTSTRAP_SERVERS: "${VBS_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
      VBS_MINIO_INTERNAL_ENDPOINT: "${VBS_MINIO_INTERNAL_ENDPOINT:-http://minio:9000}"
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      VBS_CHECKPOINTS_BUCKET: "${VBS_CHECKPOINTS_BUCKET:-checkpoints}"
      VBS_EVIDENCE_BUCKET: "${VBS_EVIDENCE_BUCKET:-evidence}"
      VBS_FLINK_MAX_RUNTIME_MINUTES: "${VBS_FLINK_MAX_RUNTIME_MINUTES:-45}"
      VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS: "${VBS_FLINK_MAX_RUNTIME_GRACE_SECONDS:-30}"
      VBS_FLINK_DISABLE_AUTO_STOP: "${VBS_FLINK_DISABLE_AUTO_STOP:-false}"
    volumes:
      - ./:/workspace

  pinot-zookeeper:
    image: zookeeper:3.9.3
    profiles: ["serving", "all"]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "ruok"
    volumes:
      - pinot_zookeeper_data:/data
      - pinot_zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181'"]
      interval: 15s
      timeout: 10s
      retries: 20

  pinot-controller:
    image: apachepinot/pinot:1.4.0
    profiles: ["serving", "all"]
    depends_on:
      pinot-zookeeper:
        condition: service_healthy
    command:
      [
        "StartController",
        "-zkAddress",
        "pinot-zookeeper:2181",
        "-clusterName",
        "vina-bim-shop-pinot",
        "-controllerPort",
        "9000",
      ]
    ports:
      - "9003:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 15s
      timeout: 10s
      retries: 20

  pinot-broker:
    image: apachepinot/pinot:1.4.0
    profiles: ["serving", "all"]
    depends_on:
      pinot-controller:
        condition: service_healthy
    command:
      [
        "StartBroker",
        "-zkAddress",
        "pinot-zookeeper:2181",
        "-clusterName",
        "vina-bim-shop-pinot",
        "-brokerPort",
        "8000",
      ]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 15s
      timeout: 10s
      retries: 20

  pinot-server:
    image: apachepinot/pinot:1.4.0
    profiles: ["serving", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      pinot-controller:
        condition: service_healthy
    command:
      [
        "StartServer",
        "-zkAddress",
        "pinot-zookeeper:2181",
        "-clusterName",
        "vina-bim-shop-pinot",
        "-serverPort",
        "7050",
      ]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7050'"]
      interval: 15s
      timeout: 10s
      retries: 20

  airflow-webserver:
    build:
      context: .
      dockerfile: ./infra/orchestration/airflow/Dockerfile
    image: vina-bim-shop/airflow:2.10.5-gx
    profiles: ["orchestration", "all"]
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow_password@lakehouse-postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW_CONN_DATAHUB_REST_DEFAULT: '{"conn_type": "datahub_rest", "host": "http://datahub-gms:8080"}'
      PYTHONPATH: "/workspace/src"
      VBS_TRINO_URL: "http://trino:8080"
      VBS_TRINO_USER: "vina_analyst"
    volumes:
      - ./:/workspace
      - ./airflow/dags:/opt/airflow/dags:ro
