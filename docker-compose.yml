name: vina-bim-shop

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    profiles: ["ingestion", "all"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.3
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.8.3
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: "vina-bim-shop-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect_configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect_offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect_status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["ingestion", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "vina-bim-shop-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "local-connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["lakehouse", "all"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
      MINIO_REGION_NAME: "${VBS_MINIO_REGION:-us-east-1}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["lakehouse", "all"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    volumes:
      - ./infra/lakehouse/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]

  lakehouse-postgres:
    image: postgres:16.4
    profiles: ["lakehouse", "all"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${VBS_LAKEHOUSE_POSTGRES_DB:-platform}"
      POSTGRES_USER: "${VBS_LAKEHOUSE_POSTGRES_USER:-vina_platform}"
      POSTGRES_PASSWORD: "${VBS_LAKEHOUSE_POSTGRES_PASSWORD:-vina_platform_password}"
    volumes:
      - lakehouse_postgres_data:/var/lib/postgresql/data
      - ./infra/lakehouse/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 12

  hive-metastore:
    build:
      context: ./infra/lakehouse/hive
      dockerfile: Dockerfile
    image: vina-bim-shop/hive-metastore:4.1.0-postgres
    profiles: ["lakehouse", "all"]
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: "metastore"
      DB_DRIVER: "postgres"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://lakehouse-postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive_metastore
        -Djavax.jdo.option.ConnectionPassword=hive_metastore_password
        -Dhive.metastore.warehouse.dir=s3a://silver/warehouse
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=${VBS_MINIO_ROOT_USER:-vina_minio}
        -Dfs.s3a.secret.key=${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
    volumes:
      - ./infra/lakehouse/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 10s
      retries: 12

  trino:
    image: trinodb/trino:476
    profiles: ["lakehouse", "all"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      VBS_MINIO_ROOT_USER: "${VBS_MINIO_ROOT_USER:-vina_minio}"
      VBS_MINIO_ROOT_PASSWORD: "${VBS_MINIO_ROOT_PASSWORD:-vina_minio_password}"
    volumes:
      - ./infra/lakehouse/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/lakehouse/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/lakehouse/trino/catalog:/etc/trino/catalog:ro
      - ./infra/lakehouse/trino/sql:/etc/trino/sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  kafka_kraft_data:
  minio_data:
  lakehouse_postgres_data:
