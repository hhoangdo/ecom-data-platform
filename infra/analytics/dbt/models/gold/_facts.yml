    - name: shipment_status
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_shipment_status')
        to_columns:
        - shipment_status
    - name: is_delivery_delayed
      data_type: boolean
    - name: is_payment_blocked
      data_type: boolean
    - name: handoff_ts
      data_type: timestamp
    - name: estimated_delivery_ts
      data_type: timestamp
    - name: created_ts
      data_type: timestamp
  - name: fact_inventory_snapshot
    config:
      contract:
        enforced: true
    constraints:
    - type: primary_key
      columns:
      - product_key
      - seller_key
      - snapshot_date_key
    columns:
    - name: inventory_snapshot_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: unique
    - name: snapshot_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: unique
      tests:
      - not_null
      - unique
    - name: product_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_product')
        to_columns:
        - product_key
    - name: seller_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_seller')
        to_columns:
        - seller_key
    - name: snapshot_date_key
      data_type: integer
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_date')
        to_columns:
        - date_key
    - name: product_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_product')
        to_columns:
        - product_id
    - name: seller_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_seller')
        to_columns:
        - seller_id
    - name: snapshot_ts
      data_type: timestamp
    - name: stock_on_hand
      data_type: bigint
    - name: reserved_stock
      data_type: bigint
    - name: available_stock
      data_type: bigint
  - name: fact_promotion_application
    config:
      contract:
        enforced: true
    columns:
    - name: promotion_application_key
      data_type: bigint
      constraints:
      - type: primary_key
    - name: order_item_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: unique
      - type: foreign_key
        to: ref('fact_order_item')
        to_columns:
        - order_item_id
      tests:
      - not_null
      - unique
    - name: order_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('fact_order')
        to_columns:
        - order_id
    - name: order_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('fact_order')
        to_columns:
        - order_key
    - name: customer_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_customer')
        to_columns:
        - customer_key
    - name: promotion_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_promotion')
        to_columns:
        - promotion_key
    - name: promotion_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_promotion')
        to_columns:
        - promotion_id
