      - not_null
      - unique
    - name: order_id
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('fact_order')
        to_columns:
        - order_id
    - name: order_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('fact_order')
        to_columns:
        - order_key
    - name: customer_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_customer')
        to_columns:
        - customer_key
    - name: shipment_status_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_shipment_status')
        to_columns:
        - shipment_status_key
    - name: shipping_method_key
      data_type: bigint
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_shipping_method')
        to_columns:
