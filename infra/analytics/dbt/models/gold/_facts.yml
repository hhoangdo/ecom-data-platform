      - type: not_null
      - type: foreign_key
        to: ref('dim_customer')
        to_columns:
        - customer_id
    - name: shipping_city
      data_type: varchar
    - name: shipping_region
      data_type: varchar
    - name: shipping_method
      data_type: varchar
      constraints:
      - type: not_null
      - type: foreign_key
        to: ref('dim_shipping_method')
        to_columns:
