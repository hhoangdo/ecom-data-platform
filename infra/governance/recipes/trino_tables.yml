source:
  type: trino
  config:
    host_port: "trino:8080"
    username: vina_analyst
    database: iceberg
    schema_pattern:
      allow:
        - ".*"
    table_pattern:
      allow:
        - ".*"
    include_views: false
    include_tables: true
    stateful_ingestion:
      enabled: true

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"
