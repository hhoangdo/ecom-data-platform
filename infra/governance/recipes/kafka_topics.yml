source:
  type: kafka
  config:
    connection:
      bootstrap: "kafka:29092"
      schema_registry_url: "http://schema-registry:8081"
      consumer_config:
        security.protocol: "PLAINTEXT"
    topic_patterns:
      allow:
        - "commerce_events"
        - "catalog_events"
        - "fulfillment_events"
        - "ops_events"
        - "dead_letter_events"
        - "realtime_commerce_metrics_1m"
        - "realtime_ops_alerts"
        - "realtime_metric_corrections"
      ignoreCase: true

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"
