platform_name: vina-bim-shop
random_seed: 42
default_scale: medium
end_date: "2026-05-01"

taxonomy:
  source_path: data/reference/taxonomy/taxonomy_snapshot.yaml

scale_profiles:
  smoke:
    history_days: 7
    entities:
      customers: 800
      sellers: 80
      products: 600
      orders: 1800
      promotions: 16
  medium:
    history_days: 60
    entities:
      customers: 12000
      sellers: 600
      products: 6000
      orders: 45000
      promotions: 80
  coursework:
    history_days: 90
    entities:
      customers: 50000
      sellers: 2500
      products: 30000
      orders: 150000
      promotions: 180

outputs:
  raw_root: data/raw
  evidence_root: evidence/01_data_generator

quality_scenarios:
  hcmc_hanoi_skew_ratio: 0.45
  offline_duplicate_rate: 0.02
  stream_duplicate_rate: 0.015
  late_arrival_rate: 0.12
  missing_shipping_method_rate: 0.03
  missing_brand_rate: 0.02
  missing_device_type_rate: 0.04
  schema_evolution_cutoff_ratio: 0.45
  late_delay_minutes_min: 5
  late_delay_minutes_max: 45

category_weights:
  FMCG: 0.36
  ELHA: 0.30
  Fashion: 0.20
  Home & Living: 0.14

geography:
  cities:
    - city: Ho Chi Minh City
      city_code: HCM
      region: Southeast
      weight: 0.27
    - city: Ha Noi
      city_code: HAN
      region: Red River Delta
      weight: 0.18
    - city: Da Nang
      city_code: DAD
      region: Central Coast
      weight: 0.09
    - city: Hai Phong
      city_code: HPH
      region: Red River Delta
      weight: 0.07
    - city: Can Tho
      city_code: CTO
      region: Mekong Delta
      weight: 0.07
    - city: Binh Duong
      city_code: BDG
      region: Southeast
      weight: 0.07
    - city: Dong Nai
      city_code: DNA
      region: Southeast
      weight: 0.06
    - city: Hue
      city_code: HUI
      region: Central Coast
      weight: 0.05
    - city: Nha Trang
      city_code: NTR
      region: Central Coast
      weight: 0.05
    - city: Other VN
      city_code: OVN
      region: Other
      weight: 0.09

customer_segments:
  budget_shopper:
    weight: 0.30
    preferred_category: FMCG
    avg_items: 3.2
    payment_failure_rate: 0.055
    coupon_affinity: 0.70
  loyal_fmcg_repeat_buyer:
    weight: 0.26
    preferred_category: FMCG
    avg_items: 5.0
    payment_failure_rate: 0.025
    coupon_affinity: 0.55
  occasional_high_value_elha_buyer:
    weight: 0.16
    preferred_category: ELHA
    avg_items: 1.4
    payment_failure_rate: 0.035
    coupon_affinity: 0.35
  fashion_browser:
    weight: 0.17
    preferred_category: Fashion
    avg_items: 2.1
    payment_failure_rate: 0.040
    coupon_affinity: 0.50
  home_improver:
    weight: 0.11
    preferred_category: Home & Living
    avg_items: 2.4
    payment_failure_rate: 0.030
    coupon_affinity: 0.38

seller_tiers:
  official:
    weight: 0.16
    rating_mean: 4.75
    fulfillment_days_mean: 1.8
    inventory_reliability_mean: 0.97
    price_band: premium
  preferred:
    weight: 0.34
    rating_mean: 4.45
    fulfillment_days_mean: 2.4
    inventory_reliability_mean: 0.92
    price_band: mid
  standard:
    weight: 0.38
    rating_mean: 4.10
    fulfillment_days_mean: 3.2
    inventory_reliability_mean: 0.86
    price_band: value
  new_seller:
    weight: 0.12
    rating_mean: 3.85
    fulfillment_days_mean: 4.5
    inventory_reliability_mean: 0.76
    price_band: budget

streaming:
  abandoned_session_ratio: 0.22
  anonymous_first_event_rate: 0.35
  repeated_view_rate: 0.45
  burst_windows:
    - "12:00-12:20"
    - "20:00-20:20"
  device_types:
    app_ios: 0.24
    app_android: 0.52
    mobile_web: 0.17
    desktop_web: 0.07
  sources:
    app: 0.70
    web: 0.20
    ads: 0.10

kafka:
  bootstrap_servers: localhost:9092
  event_format: json
  producer: vina_bim_shop.synthetic_source
  topics:
    commerce_events:
      schema_version: 1
      description: Customer session, cart, checkout, order, and payment events.
    catalog_events:
      schema_version: 1
      description: Product, price, inventory, and promotion source changes.
    fulfillment_events:
      schema_version: 1
      description: Shipment lifecycle events from creation through delivery or payment block.
    ops_events:
      schema_version: 1
      description: Source observability events for bursts, lateness, duplicates, and schema changes.
  watermark:
    event_time_column: event_timestamp
    out_of_orderness_seconds: 5
    allowed_lateness_seconds: 10
  consumer_freshness_targets:
    executive_teams_minutes: 60
    bi_livestreaming_teams_seconds: 30
